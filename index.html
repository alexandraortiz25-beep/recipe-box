<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipe Box</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body>
<main class="container py-5">

<h1 class="mb-4">Recipe Box</h1>

<section class="mb-5">
<h2>Find a recipe</h2>

<div class="input-group mb-3">
<input
type="number"
id="recipe-id"
class="form-control"
placeholder="Enter recipe number">

<button
id="get-btn"
class="btn btn-primary">
Get recipe
</button>
</div>

<p id="status" class="mt-2"></p>

<div id="recipe"></div>
</section>

<hr class="my-4">

<section>
<h2>Add a dish</h2>

<div class="input-group mb-3">
<input
type="text"
id="dish-name"
class="form-control"
placeholder="Enter dish name">

<button
id="post-btn"
class="btn btn-success">
Add it
</button>
</div>

<p id="post-status" class="mt-2"></p>

<div id="saved"></div>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
